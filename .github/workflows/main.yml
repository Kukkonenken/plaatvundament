name: Deploy to Zone

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH setup — write private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy with rsync
        run: |
          rsync -av --delete --exclude '.git*' --exclude '.github*' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./* virt140108@${{ secrets.HOST_SERVER_IP }}:/data01/virt140108/domeenid/www.plaatvundament.com/htdocs/
